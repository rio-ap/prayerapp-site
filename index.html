<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prayer Alarm</title>
<meta http-equiv="refresh" content="0; url=privacy-policy/">
<link rel="icon" href="icon.png" type="image/png">
<style>
:root{
  --ink:#062B26; --deep:#0E4F45; --teal:#00695C; --teal-light:#14867A;
  --mint:#A5D6A7; --pale:#E8F5E9; --white:#FFFFFF;
  --gold:#F2C14E; --gold-hi:#FFE9A8; --radius:16px; color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--pale);color:var(--ink);
  font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:var(--teal);text-decoration-thickness:1px;text-underline-offset:2px}
.app-bar{background:var(--teal);color:var(--pale);position:sticky;top:0;z-index:20;
  box-shadow:0 2px 10px rgba(6,43,38,.28)}
.app-bar-inner{max-width:880px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.app-bar img{width:40px;height:40px;border-radius:10px;image-rendering:pixelated;
  box-shadow:0 0 0 2px rgba(232,245,233,.18)}
.app-bar .titles{display:flex;flex-direction:column;line-height:1.2}
.app-bar .app{font-weight:700;font-size:1.02rem;letter-spacing:.2px}
.app-bar .sub{font-size:.76rem;color:var(--pale);opacity:.85}
.lang{margin-left:auto;display:inline-flex;gap:4px;padding:4px;border-radius:999px;
  background:rgba(232,245,233,.14)}
.lang button{border:0;background:transparent;color:var(--pale);font:inherit;font-weight:700;
  font-size:.82rem;padding:7px 14px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--gold-hi);color:var(--ink)}
.lang button:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
main{max-width:880px;margin:0 auto;padding:16px 16px 40px}
.hero{background:var(--deep);color:var(--pale);border-radius:var(--radius);padding:22px;
  margin:4px 0 16px;box-shadow:0 2px 10px rgba(6,43,38,.22)}
.hero h1{margin:0 0 8px;font-size:1.45rem;line-height:1.25}
.hero .meta{margin:0;font-size:.86rem;color:var(--pale);opacity:.92}
.hero .meta b,.hero .meta strong{color:var(--gold-hi);font-weight:600}
.hero .meta code{color:var(--gold-hi);background:transparent}
.card{background:var(--white);border-radius:var(--radius);padding:20px 22px 6px;
  margin:14px 0;box-shadow:0 2px 8px rgba(6,43,38,.10)}
.card h2{margin:0 0 10px;font-size:1.08rem;color:var(--teal);line-height:1.3}
.card h3{margin:16px 0 6px;font-size:.98rem;color:var(--deep)}
.card p,.card li{font-size:.94rem}
.card p{margin:0 0 12px}
.card ul,.card ol{margin:0 0 12px;padding-left:1.25rem}
.card li{margin:4px 0}
.card table{width:100%;border-collapse:collapse;margin:6px 0 14px;font-size:.88rem;
  display:block;overflow-x:auto}
.card th,.card td{padding:8px 10px;border-bottom:1px solid #D7E7DA;text-align:left;vertical-align:top}
.card th{color:var(--teal);font-weight:600;white-space:nowrap}
.card tr:last-child td{border-bottom:0}
.card code{background:var(--pale);border-radius:4px;padding:1px 4px;font-size:.85em}
footer{max-width:880px;margin:0 auto;padding:8px 16px 40px;color:var(--deep);font-size:.82rem}
footer .rule{height:1px;background:#CFE3D2;margin:12px 0}
.landing{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:24px}
.landing .card{text-align:center;padding:28px 24px}
.landing h1{margin:0 0 8px;color:var(--teal);font-size:1.5rem}
.landing p{margin:0 0 18px}
.landing a.button{display:inline-block;background:var(--teal);color:var(--pale);
  padding:12px 22px;border-radius:12px;text-decoration:none;font-weight:600}
@media (max-width:520px){
  .app-bar .sub{display:none}
  .hero{padding:18px}
  .card{padding:18px 16px 4px}
  .lang button{padding:6px 11px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="landing">
  <div class="card">
    <h1>Prayer Alarm</h1>
    <p>Kebijakan privasi · Privacy policy</p>
    <a class="button" href="privacy-policy/">Buka / Open</a>
  </div>
</div>
</body>
</html>
